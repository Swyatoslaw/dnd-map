<!--version 1.2-->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>P2P Tabletop Map (Trystero)</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { margin: 0; padding: 20px; background: #18181b; color: #f4f4f5; }
        .panel { background: #27272a; padding: 16px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #3f3f46; }
        #board { position: relative; border: 2px dashed #52525b; background-size: contain; background-repeat: no-repeat; display: inline-block; min-width: 500px; min-height: 500px; overflow: hidden; border-radius: 8px; }

        .token {
            position: absolute; width: 60px; height: 60px; border-radius: 50%;
            border: 3px solid #60a5fa; cursor: grab; user-select: none;
            display: flex; align-items: center; justify-content: center;
            background: #3b82f6; font-weight: bold; font-size: 14px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); background-size: cover; background-position: center;
            transition: box-shadow 0.2s;
        }
        .token:hover { box-shadow: 0 0 15px #60a5fa; }
        .token.disabled { cursor: not-allowed; opacity: 0.7; filter: grayscale(40%); }
        .token-label {
            position: absolute; bottom: -22px; background: rgba(0,0,0,0.8);
            padding: 2px 6px; border-radius: 4px; font-size: 11px; white-space: nowrap;
        }

        .player-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; background: #18181b; padding: 8px; border-radius: 6px; }
        input[type="text"] { padding: 6px 10px; border-radius: 4px; border: 1px solid #52525b; background: #09090b; color: #fff; }
        button { padding: 6px 12px; border-radius: 4px; border: none; background: #2563eb; color: #fff; cursor: pointer; font-weight: 500; }
        button:hover { background: #1d4ed8; }
        button.secondary { background: #3f3f46; }
        button.secondary:hover { background: #52525b; }
        button.danger { background: #dc2626; }
        button.danger:hover { background: #b91c1c; }
        .controls-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    </style>

    <!-- Импорт Trystero (модуль Nostr) -->
    <script type="importmap">
        {
          "imports": {
            "trystero": "https://cdn.jsdelivr.net/npm/trystero@0.22.0/nostr/+esm"
          }
        }
    </script>
</head>
<body>

<!-- Панель Ведущего -->
<div id="host-controls" class="panel" style="display: none;">
    <h2>Панель Ведущего</h2>

    <div id="restore-banner" style="display:none; background:#3f3f46; padding:10px; border-radius:6px; margin-bottom:12px;">
        Обнаружена сохраненная игра!
        <button id="restore-btn">Возобновить прошлую игру</button>
        <button class="danger" id="clear-btn">Начать заново</button>
    </div>

    <div class="controls-group">
        <label>1. Картинка карты: <input type="file" id="map-input" accept="image/*"></label>
        <button class="secondary" id="copy-all-btn">📋 Скопировать ссылки для ВСЕХ</button>
    </div>

    <h4 style="margin-bottom: 8px;">2. Игроки и аватарки:</h4>
    <div id="players-list"></div>
    <br>
    <div class="controls-group">
        <input type="text" id="new-player-name" placeholder="Имя игрока">
        <input type="text" id="new-player-avatar" placeholder="URL аватарки">
        <button id="add-player-btn">Добавить игрока</button>
    </div>
</div>

<!-- Статус Игрока -->
<div id="client-controls" class="panel" style="display: none;">
    <h3 id="status">Подключение к P2P сети...</h3>
</div>

<div id="board"></div>

<script type="module">
    import { joinRoom } from 'trystero';

    const STORAGE_KEY = 'p2p_tabletop_trystero';

    const urlParams = new URLSearchParams(window.location.hash.substring(1));
    let roomId = urlParams.get('room');
    let myPlayerName = urlParams.get('player');
    let isHost = !roomId;

    let gameState = {
        bgImage: null,
        tokens: {}
    };

    // 1. Инициализация комнаты
    if (isHost) {
        document.getElementById('host-controls').style.display = 'block';

        const savedData = localStorage.getItem(STORAGE_KEY);
        if (savedData) {
            document.getElementById('restore-banner').style.display = 'block';
        }

        if (!roomId) {
            roomId = 'room-' + Math.random().toString(36).substring(2, 9);
            window.location.hash = `room=${roomId}`;
        }
    } else {
        document.getElementById('client-controls').style.display = 'block';
        document.getElementById('status').innerText = `Комната: ${roomId} | Вы зашли как: ${myPlayerName}`;
    }

    // Подключаемся к P2P комнате Trystero
    const config = { appId: 'vtt-tabletop-map-app' };
    const room = joinRoom(config, roomId);

    // Создаем каналы передачи данных
    const [sendState, getState] = room.makeAction('state');
    const [sendMove, getMove] = room.makeAction('move');

    // Реакция на подключение нового пира
    room.onPeerJoin(peerId => {
        console.log('Подключился новый участник:', peerId);
        if (isHost) {
            // Хост отправляет свежее состояние игры новому игроку
            sendState(gameState, peerId);
        }
    });

    // Обработка входящих данных
    getState((receivedState) => {
        if (!isHost) {
            gameState = receivedState;
            renderBoard();
        }
    });

    getMove((moveData) => {
        if (gameState.tokens[moveData.name]) {
            gameState.tokens[moveData.name].x = moveData.x;
            gameState.tokens[moveData.name].y = moveData.y;
            renderBoard();

            if (isHost) {
                saveAndBroadcast();
            }
        }
    });

    // --- ФУНКЦИИ ХОСТА ---

    function saveAndBroadcast() {
        if (!isHost) return;
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ roomId, gameState }));
        sendState(gameState); // Отправка всем
    }

    document.getElementById('map-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            gameState.bgImage = event.target.result;
            saveAndBroadcast();
            renderBoard();
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('add-player-btn').addEventListener('click', () => {
        const nameInput = document.getElementById('new-player-name');
        const avatarInput = document.getElementById('new-player-avatar');
        const name = nameInput.value.trim();
        const avatar = avatarInput.value.trim();

        if (!name || gameState.tokens[name]) return;

        gameState.tokens[name] = {
            x: 50 + Object.keys(gameState.tokens).length * 20,
            y: 50,
            avatar: avatar || null
        };

        nameInput.value = '';
        avatarInput.value = '';

        renderHostPlayerList();
        saveAndBroadcast();
        renderBoard();
    });

    document.getElementById('copy-all-btn').addEventListener('click', () => {
        const players = Object.keys(gameState.tokens);
        if (players.length === 0) return alert('Добавьте игроков!');

        let text = `🎲 Ссылки для входа на карту:\n\n`;
        players.forEach(name => {
            const link = `${window.location.origin}${window.location.pathname}#room=${roomId}&player=${encodeURIComponent(name)}`;
            text += `👤 ${name}: ${link}\n`;
        });

        navigator.clipboard.writeText(text).then(() => alert('Все ссылки скопированы!'));
    });

    document.getElementById('restore-btn')?.addEventListener('click', () => {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved) {
            roomId = saved.roomId;
            gameState = saved.gameState;
            window.location.hash = `room=${roomId}`;
            document.getElementById('restore-banner').style.display = 'none';
            renderHostPlayerList();
            renderBoard();
            sendState(gameState);
        }
    });

    document.getElementById('clear-btn')?.addEventListener('click', () => {
        localStorage.removeItem(STORAGE_KEY);
        document.getElementById('restore-banner').style.display = 'none';
    });

    function renderHostPlayerList() {
        const container = document.getElementById('players-list');
        container.innerHTML = '';

        Object.entries(gameState.tokens).forEach(([name, tokenData]) => {
            const div = document.createElement('div');
            div.className = 'player-row';
            const link = `${window.location.origin}${window.location.pathname}#room=${roomId}&player=${encodeURIComponent(name)}`;

            div.innerHTML = `
          <strong>${name}</strong>
          <input type="text" placeholder="URL Аватарки" value="${tokenData.avatar || ''}" class="avatar-edit" style="width: 180px;">
          <button class="secondary copy-single-btn">Ссылка</button>
          <button class="danger delete-btn">✕</button>
        `;

            div.querySelector('.avatar-edit').addEventListener('change', (e) => {
                gameState.tokens[name].avatar = e.target.value.trim() || null;
                saveAndBroadcast();
                renderBoard();
            });

            div.querySelector('.copy-single-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(link);
            });

            div.querySelector('.delete-btn').addEventListener('click', () => {
                delete gameState.tokens[name];
                renderHostPlayerList();
                saveAndBroadcast();
                renderBoard();
            });

            container.appendChild(div);
        });
    }

    // --- РЕНДЕРИНГ И ДВИЖЕНИЕ ---

    function renderBoard() {
        const board = document.getElementById('board');
        board.style.backgroundImage = gameState.bgImage ? `url(${gameState.bgImage})` : 'none';

        if (gameState.bgImage) {
            const img = new Image();
            img.src = gameState.bgImage;
            img.onload = () => {
                board.style.width = img.width + 'px';
                board.style.height = img.height + 'px';
            };
        }

        board.innerHTML = '';

        Object.entries(gameState.tokens).forEach(([name, pos]) => {
            const token = document.createElement('div');
            token.className = 'token';

            if (pos.avatar) {
                token.style.backgroundImage = `url(${pos.avatar})`;
                token.innerText = '';
            } else {
                token.innerText = name.substring(0, 2).toUpperCase();
            }

            const label = document.createElement('div');
            label.className = 'token-label';
            label.innerText = name;
            token.appendChild(label);

            token.style.left = pos.x + 'px';
            token.style.top = pos.y + 'px';

            const canMove = isHost || name === myPlayerName;

            if (canMove) {
                makeDraggable(token, name);
            } else {
                token.classList.add('disabled');
            }

            board.appendChild(token);
        });
    }

    function makeDraggable(element, playerName) {
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        element.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            initialLeft = element.offsetLeft;
            initialTop = element.offsetTop;
            element.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            const newX = initialLeft + dx;
            const newY = initialTop + dy;

            element.style.left = newX + 'px';
            element.style.top = newY + 'px';

            gameState.tokens[playerName].x = newX;
            gameState.tokens[playerName].y = newY;
        });

        document.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            element.style.cursor = 'grab';

            // Отправляем перемещение
            sendMove({
                name: playerName,
                x: gameState.tokens[playerName].x,
                y: gameState.tokens[playerName].y
            });

            if (isHost) {
                saveAndBroadcast();
            }
        });
    }
</script>
</body>
</html>
