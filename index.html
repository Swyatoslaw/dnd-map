<!--version 1.3-->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>P2P Tabletop Map (Trystero)</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { margin: 0; padding: 20px; background: #18181b; color: #f4f4f5; }
        .panel { background: #27272a; padding: 16px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #3f3f46; }
        #board { position: relative; border: 2px dashed #52525b; background-size: contain; background-repeat: no-repeat; display: inline-block; min-width: 500px; min-height: 500px; overflow: hidden; border-radius: 8px; }

        .token {
            position: absolute; width: 60px; height: 60px; border-radius: 50%;
            border: 3px solid #60a5fa; cursor: grab; user-select: none; touch-action: none;
            display: flex; align-items: center; justify-content: center;
            background: #3b82f6; font-weight: bold; font-size: 14px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); background-size: cover; background-position: center;
            transition: box-shadow 0.2s;
        }
        .token:hover { box-shadow: 0 0 15px #60a5fa; }
        .token.disabled { cursor: not-allowed; opacity: 0.7; filter: grayscale(40%); }
        .token-label {
            position: absolute; bottom: -22px; background: rgba(0,0,0,0.8);
            padding: 2px 6px; border-radius: 4px; font-size: 11px; white-space: nowrap;
        }

        .player-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; background: #18181b; padding: 8px; border-radius: 6px; }
        /* Имя занимает фиксированную ширину, дальше все идет подряд слева */
        .player-row .player-name { width: 140px; flex: none; overflow: hidden; text-overflow: ellipsis; }
        .player-row .avatar-edit { width: 220px; }
        #map-url { width: 280px; }

        /* Кнопка выбора файла: label поверх скрытого input[type=file] */
        .file-btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 6px 10px; border-radius: 4px; background: #3f3f46;
            cursor: pointer; user-select: none; line-height: 1;
        }
        .file-btn:hover { background: #52525b; }
        .file-btn input[type="file"] { display: none; }

        /* Смысловые группы настроек ведущего */
        .section { background: #1f1f23; border: 1px solid #3f3f46; border-radius: 8px; padding: 14px; margin-top: 12px; }
        .section > h4 {
            margin: 0 0 12px; font-size: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.06em; color: #a1a1aa;
        }

        input[type="text"] { padding: 6px 10px; border-radius: 4px; border: 1px solid #52525b; background: #09090b; color: #fff; }
        button { padding: 6px 12px; border-radius: 4px; border: none; background: #725faa; color: #fff; cursor: pointer; font-weight: 500; }
        button:hover { background: #846ec3; }
        button.secondary { background: #3f3f46; }
        button.secondary:hover { background: #52525b; }
        button.danger { background: #95637d; }
        button.danger:hover { background: #ac7290; }
        .controls-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        /* Область просмотра карты с зумом/панорамированием */
        #board-wrap {
            position: relative; width: 100%; height: 72vh; overflow: hidden;
            border: 2px solid #3f3f46; border-radius: 8px; background: #0b0b0d;
            touch-action: none; /* сами обрабатываем жесты pan/pinch */
        }
        #board { transform-origin: 0 0; will-change: transform; }

        #zoom-controls {
            position: fixed; right: 16px; bottom: 16px; z-index: 50;
            display: flex; gap: 6px; background: rgba(39,39,42,0.9);
            padding: 8px; border-radius: 10px; border: 1px solid #3f3f46;
            backdrop-filter: blur(4px);
        }
        #zoom-controls button {
            width: 42px; height: 42px; font-size: 20px; line-height: 1;
            display: flex; align-items: center; justify-content: center; padding: 0;
        }
        /* Кнопка показа/скрытия панели (у ведущего и у игрока).
           Панель открыта — кнопка стоит в потоке, в левом верхнем углу панели.
           Панель скрыта — кнопка висит поверх карты слева сверху. */
        #toggle-panel-btn {
            width: 32px; height: 32px; padding: 0; font-size: 16px; line-height: 1;
            flex: none; display: none; align-items: center; justify-content: center;
        }
        body.panel-hidden #toggle-panel-btn {
            position: fixed; top: 16px; left: 16px; z-index: 60;
            width: 42px; height: 42px; font-size: 20px;
            background: rgba(39,39,42,0.9); border: 1px solid #3f3f46;
            backdrop-filter: blur(4px);
        }
        #toggle-panel-btn:hover { background: #3f3f46; }

        /* Шапка панели ведущего: кнопка + заголовок в одну строку */
        #host-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        #host-header h2 { margin: 0; }

        /* Компактная шапка игрока: кнопка + статус в одну строку */
        #client-controls { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
        #status { margin: 0; font-size: 13px; font-weight: 500; color: #a1a1aa; }

        /* У игрока карта занимает всё место, кроме отступов body и шапки */
        body.role-player { display: flex; flex-direction: column; gap: 12px; height: 100vh; }
        body.role-player .panel { margin-bottom: 0; }
        body.role-player #board-wrap { flex: 1 1 auto; height: auto; min-height: 0; }

        /* Панель скрыта — карта занимает весь экран */
        body.panel-hidden { padding: 8px; }
        body.panel-hidden:not(.role-player) #board-wrap { height: calc(100vh - 16px); }

        #zoom-level {
            min-width: 52px; display: flex; align-items: center; justify-content: center;
            font-size: 13px; color: #a1a1aa;
        }

        /* Узкий экран: поля не пытаются влезть в одну строку, а идут в столбик */
        @media (max-width: 700px) {
            body { padding: 10px; }

            .player-row { align-items: stretch; }
            /* Имя — отдельной строкой, поле ссылки — на всю ширину, кнопки — строкой под ними */
            .player-row .player-name { width: 100%; }
            .player-row .avatar-edit,
            #map-url,
            .controls-group input[type="text"],
            .controls-group > label { flex: 1 1 100%; width: 100%; min-width: 0; }

            .player-row .copy-single-btn { flex: 1 1 auto; }
            .file-btn, .player-row button { min-height: 36px; }
        }
    </style>

    <!-- Импорт Trystero (модуль Nostr) -->
    <script type="importmap">
        {
          "imports": {
            "trystero": "https://cdn.jsdelivr.net/npm/trystero@0.22.0/nostr/+esm"
          }
        }
    </script>
</head>
<body>

<!-- Кнопка показа/скрытия панели. Когда панель открыта — переезжает в ее левый верхний угол -->
<button id="toggle-panel-btn" class="secondary" title="Скрыть панель">⚙</button>

<!-- Панель Ведущего -->
<div id="host-controls" class="panel" style="display: none;">
    <div id="host-header">
        <h2>Панель Ведущего</h2>
    </div>

    <div id="restore-banner" style="display:none; background:#3f3f46; padding:10px; border-radius:6px; margin-bottom:12px;">
        Обнаружена сохраненная игра!
        <button id="restore-btn">Возобновить прошлую игру</button>
        <button class="danger" id="clear-btn">Начать заново</button>
    </div>

    <!-- 1. Карта -->
    <section class="section">
        <h4>1. Картинка карты</h4>
        <div class="controls-group">
            <label>Файл: <input type="file" id="map-input" accept="image/*"></label>
            <span style="color:#a1a1aa;">или</span>
            <input type="text" id="map-url" placeholder="URL картинки (https://...)">
            <button class="secondary" id="map-url-btn">Загрузить по ссылке</button>
            <button class="secondary" id="map-clear-btn" title="Убрать карту">✕</button>
        </div>
        <div id="map-note" style="display:none; margin-top:8px; font-size:13px;"></div>
    </section>

    <!-- 2. Игроки -->
    <section class="section">
        <h4>2. Игроки и аватарки</h4>
        <div class="controls-group" style="margin-bottom: 10px;">
            <button class="secondary" id="copy-all-btn">📋 Скопировать ссылки для ВСЕХ</button>
        </div>
        <div id="players-list"></div>
        <div class="controls-group" style="margin-top: 12px;">
            <input type="text" id="new-player-name" placeholder="Имя игрока">
            <input type="text" id="new-player-avatar" placeholder="Ссылка на аватарку">
            <label class="file-btn" title="Выбрать файл аватарки">📁<input type="file" accept="image/*" id="new-player-avatar-file"></label>
            <span id="new-player-avatar-note" style="color:#a1a1aa; font-size:13px;"></span>
            <button id="add-player-btn">Добавить игрока</button>
        </div>
    </section>

    <!-- 3. Комната -->
    <section class="section">
        <h4>3. Комната</h4>
        <div class="controls-group">
            <button class="danger" id="recreate-room-btn" title="Создать новую комнату, сохранив карту, аватарки и позиции">🔄 Пересоздать комнату</button>
            <span style="color:#a1a1aa; font-size:13px;">Если игроки перестали подключаться</span>
        </div>
        <div id="recreate-note" style="display:none; background:#3f3f46; padding:10px; border-radius:6px; margin-top:12px;"></div>
    </section>
</div>

<!-- Статус Игрока -->
<div id="client-controls" class="panel" style="display: none;">
    <div id="status">Подключение к P2P сети...</div>
</div>

<div id="board-wrap">
    <div id="board"></div>
</div>

<div id="zoom-controls">
    <button id="zoom-out" title="Отдалить">−</button>
    <span id="zoom-level">100%</span>
    <button id="zoom-in" title="Приблизить">+</button>
    <button id="zoom-reset" class="secondary" title="Сбросить" style="font-size:16px;">⟲</button>
</div>

<script type="module">
    import { joinRoom } from 'trystero';

    const STORAGE_KEY = 'p2p_tabletop_trystero';
    const PANEL_KEY = 'p2p_tabletop_panel_hidden';

    const urlParams = new URLSearchParams(window.location.hash.substring(1));
    let roomId = urlParams.get('room');
    let myPlayerName = urlParams.get('player');
    // host=1 в хеше — чтобы после перезагрузки страницы ведущий остался ведущим
    let isHost = !roomId || urlParams.get('host') === '1';

    const newRoomId = () => 'room-' + Math.random().toString(36).substring(2, 9);
    // У ведущего в адресе есть метка host=1, у игроков — их имя
    const hostHash = (id) => `room=${id}&host=1`;

    let gameState = {
        bgImage: null,
        tokens: {}
    };

    // Показать/скрыть свою панель: у ведущего — настройки, у игрока — шапка со статусом.
    // Скрытая панель освобождает весь экран под карту
    const toggleBtn = document.getElementById('toggle-panel-btn');
    const myPanel = document.getElementById(isHost ? 'host-controls' : 'client-controls');
    // Место кнопки, когда панель открыта
    const btnSlot = isHost ? document.getElementById('host-header') : myPanel;

    function setPanelHidden(hidden) {
        // Пустая строка, а не 'block': у панели игрока своя flex-раскладка из CSS
        myPanel.style.display = hidden ? 'none' : '';
        document.body.classList.toggle('panel-hidden', hidden);
        // Панель скрыта — кнопка висит поверх карты, открыта — стоит в углу панели
        (hidden ? document.body : btnSlot).prepend(toggleBtn);
        toggleBtn.innerText = hidden ? '⚙' : '✕';
        toggleBtn.title = hidden ? 'Показать панель' : 'Скрыть панель';
        localStorage.setItem(PANEL_KEY, hidden ? '1' : '0');
    }

    // 1. Инициализация комнаты
    let keepPanelOpen = false;

    if (isHost) {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (savedData) {
            document.getElementById('restore-banner').style.display = 'block';
            // Панель нужна сразу: в ней лежит предложение возобновить прошлую игру
            keepPanelOpen = true;
        }

        if (!roomId) {
            roomId = newRoomId();
        }
        window.location.hash = hostHash(roomId);
    } else {
        document.body.classList.add('role-player');
        document.getElementById('status').innerText = `Комната: ${roomId} | Вы: ${myPlayerName}`;
    }

    toggleBtn.style.display = 'flex';
    toggleBtn.addEventListener('click', () => {
        setPanelHidden(!document.body.classList.contains('panel-hidden'));
    });
    setPanelHidden(!keepPanelOpen && localStorage.getItem(PANEL_KEY) === '1');

    // Подключаемся к P2P комнате Trystero
    const config = { appId: 'vtt-tabletop-map-app' };

    // room и каналы пересоздаются при переподключении, поэтому не const
    let room = null;
    let sendState = () => {};
    let sendMove = () => {};

    function handlePeerJoin(peerId) {
        console.log('Подключился новый участник:', peerId);
        if (isHost) {
            // Хост отправляет свежее состояние игры новому игроку
            sendState(gameState, peerId);
        }
    }

    function handleState(receivedState) {
        if (!isHost) {
            gameState = receivedState;
            renderBoard();
        }
    }

    function handleMove(moveData) {
        if (gameState.tokens[moveData.name]) {
            gameState.tokens[moveData.name].x = moveData.x;
            gameState.tokens[moveData.name].y = moveData.y;
            renderBoard();

            if (isHost) {
                saveAndBroadcast();
            }
        }
    }

    // Вход в комнату: отключаемся от старой (если была) и создаем каналы заново
    function connectToRoom(id) {
        if (room) {
            try { room.leave(); } catch (e) { console.warn('Не удалось покинуть комнату:', e); }
        }

        roomId = id;
        room = joinRoom(config, roomId);

        // Создаем каналы передачи данных
        let getState, getMove;
        [sendState, getState] = room.makeAction('state');
        [sendMove, getMove] = room.makeAction('move');

        // Реакция на подключение нового пира
        room.onPeerJoin(handlePeerJoin);

        // Обработка входящих данных
        getState(handleState);
        getMove(handleMove);
    }

    connectToRoom(roomId);

    // --- ФУНКЦИИ ХОСТА ---

    function saveAndBroadcast() {
        if (!isHost) return;
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ roomId, gameState }));
        } catch (e) {
            // Картинка из файла хранится как DataURL и может не влезть в localStorage
            console.warn('Не удалось сохранить игру:', e);
            showMapNote(
                'Игра не сохранилась локально — картинка слишком большая. ' +
                'Загрузите карту по ссылке вместо файла.',
                '#fbbf24'
            );
        }
        sendState(gameState); // Отправка всем
    }

    // Чтение выбранной картинки (карта или аватарка) в DataURL
    function readImageFile(file, onDone, onError = (msg) => alert(msg)) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => onDone(event.target.result);
        reader.onerror = () => onError('Не удалось прочитать файл.');
        reader.readAsDataURL(file);
    }

    // --- ФОН КАРТЫ: файл или прямая ссылка ---

    const mapNote = document.getElementById('map-note');

    function showMapNote(text, color = '#a1a1aa') {
        mapNote.style.display = text ? 'block' : 'none';
        mapNote.style.color = color;
        mapNote.innerText = text;
    }

    function setBackground(src) {
        gameState.bgImage = src;
        saveAndBroadcast();
        renderBoard();
    }

    document.getElementById('map-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        readImageFile(file, (dataUrl) => {
            document.getElementById('map-url').value = '';
            setBackground(dataUrl);
            showMapNote(`Карта загружена из файла: ${file.name}`);
        }, (msg) => showMapNote(msg, '#f87171'));
    });

    function applyMapUrl() {
        const url = document.getElementById('map-url').value.trim();
        if (!url) return;

        showMapNote('Проверяем ссылку...');

        // Сначала убеждаемся, что картинка вообще грузится — иначе разошлем игрокам битую ссылку
        const probe = new Image();
        probe.onload = () => {
            document.getElementById('map-input').value = '';
            setBackground(url);
            showMapNote(`Карта загружена по ссылке (${probe.naturalWidth}×${probe.naturalHeight}).`);
        };
        probe.onerror = () => showMapNote(
            'Картинка по этой ссылке не загрузилась. Нужна прямая ссылка на файл (.jpg/.png/.webp), ' +
            'доступная всем игрокам — страница с картинкой не подойдет.',
            '#f87171'
        );
        probe.src = url;
    }

    document.getElementById('map-url-btn').addEventListener('click', applyMapUrl);
    document.getElementById('map-url').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') applyMapUrl();
    });

    document.getElementById('map-clear-btn').addEventListener('click', () => {
        document.getElementById('map-url').value = '';
        document.getElementById('map-input').value = '';
        setBackground(null);
        showMapNote('');
    });

    // Аватарка нового игрока, выбранная файлом (URL вводится в соседнее поле)
    let newPlayerAvatarFile = null;
    const newAvatarNote = document.getElementById('new-player-avatar-note');

    document.getElementById('new-player-avatar-file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        readImageFile(file, (dataUrl) => {
            newPlayerAvatarFile = dataUrl;
            document.getElementById('new-player-avatar').value = '';
            newAvatarNote.innerText = `файл: ${file.name}`;
        });
    });

    document.getElementById('add-player-btn').addEventListener('click', () => {
        const nameInput = document.getElementById('new-player-name');
        const avatarInput = document.getElementById('new-player-avatar');
        const name = nameInput.value.trim();
        // Введенный URL важнее ранее выбранного файла
        const avatar = avatarInput.value.trim() || newPlayerAvatarFile;

        if (!name || gameState.tokens[name]) return;

        // Новую фишку тоже ставим внутри карты
        const start = clampToBoard(50 + Object.keys(gameState.tokens).length * 20, 50);

        gameState.tokens[name] = {
            x: start.x,
            y: start.y,
            avatar: avatar || null
        };

        nameInput.value = '';
        avatarInput.value = '';
        document.getElementById('new-player-avatar-file').value = '';
        newPlayerAvatarFile = null;
        newAvatarNote.innerText = '';

        renderHostPlayerList();
        saveAndBroadcast();
        renderBoard();
    });

    const playerLink = (name) =>
        `${window.location.origin}${window.location.pathname}#room=${roomId}&player=${encodeURIComponent(name)}`;

    function buildAllLinksText() {
        let text = `🎲 Ссылки для входа на карту:\n\n`;
        Object.keys(gameState.tokens).forEach(name => {
            text += `👤 ${name}: ${playerLink(name)}\n`;
        });
        return text;
    }

    document.getElementById('copy-all-btn').addEventListener('click', () => {
        if (Object.keys(gameState.tokens).length === 0) return alert('Добавьте игроков!');
        navigator.clipboard.writeText(buildAllLinksText()).then(() => alert('Все ссылки скопированы!'));
    });

    // Пересоздание комнаты: новая P2P-комната, данные игры (карта, аватарки, позиции) сохраняются
    document.getElementById('recreate-room-btn')?.addEventListener('click', () => {
        const ok = confirm(
            'Создать новую комнату?\n\n' +
            'Карта, аватарки и позиции фишек сохранятся, но у комнаты будет новый адрес — ' +
            'игрокам нужно будет отправить новые ссылки.'
        );
        if (!ok) return;

        connectToRoom(newRoomId());
        window.location.hash = hostHash(roomId);

        // Новый roomId нужно сохранить и отразить в ссылках
        saveAndBroadcast();
        renderHostPlayerList();
        renderBoard();

        const note = document.getElementById('recreate-note');
        note.style.display = 'block';
        note.innerHTML = `✅ Создана новая комната <strong>${roomId}</strong>. Отправьте игрокам новые ссылки — старые больше не работают.`;

        const players = Object.keys(gameState.tokens);
        if (players.length > 0) {
            navigator.clipboard.writeText(buildAllLinksText())
                .then(() => { note.innerHTML += ' Новые ссылки уже скопированы в буфер обмена.'; })
                .catch(() => {});
        }
    });

    document.getElementById('restore-btn')?.addEventListener('click', () => {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved) {
            gameState = saved.gameState;
            // Подключаемся именно к сохраненной комнате, чтобы старые ссылки игроков работали
            connectToRoom(saved.roomId);
            window.location.hash = hostHash(roomId);
            document.getElementById('restore-banner').style.display = 'none';
            // Если карта была задана ссылкой — показываем её в поле, чтобы можно было поправить
            if (gameState.bgImage && !gameState.bgImage.startsWith('data:')) {
                document.getElementById('map-url').value = gameState.bgImage;
            }
            renderHostPlayerList();
            renderBoard();
            sendState(gameState);
        }
    });

    document.getElementById('clear-btn')?.addEventListener('click', () => {
        localStorage.removeItem(STORAGE_KEY);
        document.getElementById('restore-banner').style.display = 'none';
    });

    function renderHostPlayerList() {
        const container = document.getElementById('players-list');
        container.innerHTML = '';

        Object.entries(gameState.tokens).forEach(([name, tokenData]) => {
            const div = document.createElement('div');
            div.className = 'player-row';
            const link = playerLink(name);

            div.innerHTML = `
          <strong class="player-name"></strong>
          <input type="text" placeholder="Ссылка на аватарку" class="avatar-edit">
          <label class="file-btn" title="Выбрать файл аватарки">📁<input type="file" accept="image/*" class="avatar-file"></label>
          <button class="secondary copy-single-btn">Ссылка для входа</button>
          <button class="danger delete-btn">✕</button>
        `;

            div.querySelector('.player-name').innerText = name;

            const avatarInput = div.querySelector('.avatar-edit');
            // DataURL из файла в поле не показываем — он огромный
            if (tokenData.avatar?.startsWith('data:')) {
                avatarInput.placeholder = 'Аватарка из файла';
            } else {
                avatarInput.value = tokenData.avatar || '';
            }

            function setAvatar(src) {
                gameState.tokens[name].avatar = src;
                saveAndBroadcast();
                renderBoard();
            }

            avatarInput.addEventListener('change', (e) => {
                setAvatar(e.target.value.trim() || null);
            });

            div.querySelector('.avatar-file').addEventListener('change', (e) => {
                readImageFile(e.target.files[0], (dataUrl) => {
                    avatarInput.value = '';
                    avatarInput.placeholder = 'Аватарка из файла';
                    setAvatar(dataUrl);
                });
            });

            div.querySelector('.copy-single-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(link);
            });

            div.querySelector('.delete-btn').addEventListener('click', () => {
                delete gameState.tokens[name];
                renderHostPlayerList();
                saveAndBroadcast();
                renderBoard();
            });

            container.appendChild(div);
        });
    }

    // --- ЗУМ И ПАНОРАМИРОВАНИЕ КАРТЫ ---

    const boardWrap = document.getElementById('board-wrap');
    const board = document.getElementById('board');
    let boardScale = 1, panX = 0, panY = 0;
    const MIN_SCALE = 0.15, MAX_SCALE = 5;
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

    function applyTransform() {
        board.style.transform = `translate(${panX}px, ${panY}px) scale(${boardScale})`;
        document.getElementById('zoom-level').innerText = Math.round(boardScale * 100) + '%';
    }

    // Масштабирование с сохранением точки (clientX/clientY) под курсором/пальцами
    function zoomTo(newScale, clientX, clientY) {
        newScale = clamp(newScale, MIN_SCALE, MAX_SCALE);
        const rect = boardWrap.getBoundingClientRect();
        const cx = clientX - rect.left, cy = clientY - rect.top;
        const k = newScale / boardScale;
        panX = cx - k * (cx - panX);
        panY = cy - k * (cy - panY);
        boardScale = newScale;
        applyTransform();
    }

    function zoomBy(factor, clientX, clientY) {
        // По умолчанию — относительно центра области просмотра
        const rect = boardWrap.getBoundingClientRect();
        zoomTo(boardScale * factor, clientX ?? rect.left + rect.width / 2, clientY ?? rect.top + rect.height / 2);
    }

    document.getElementById('zoom-in').addEventListener('click', () => zoomBy(1.25));
    document.getElementById('zoom-out').addEventListener('click', () => zoomBy(1 / 1.25));
    document.getElementById('zoom-reset').addEventListener('click', () => {
        boardScale = 1; panX = 0; panY = 0; applyTransform();
    });

    // Колесо мыши — зум к позиции курсора
    boardWrap.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomTo(boardScale * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX, e.clientY);
    }, { passive: false });

    // Жесты: панорамирование одним пальцем/мышью по фону, зум щипком двумя пальцами
    const pointers = new Map();
    let panning = false, panStart = null, pinchDist0 = 0, pinchScale0 = 1;

    boardWrap.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.token')) return; // по фишке — работает перетаскивание, не панорама
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        boardWrap.setPointerCapture(e.pointerId);
        if (pointers.size === 1) {
            panning = true;
            panStart = { x: e.clientX, y: e.clientY, panX, panY };
        } else if (pointers.size === 2) {
            panning = false;
            const [a, b] = [...pointers.values()];
            pinchDist0 = Math.hypot(a.x - b.x, a.y - b.y);
            pinchScale0 = boardScale;
        }
    });

    boardWrap.addEventListener('pointermove', (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 2) {
            const [a, b] = [...pointers.values()];
            const dist = Math.hypot(a.x - b.x, a.y - b.y);
            if (pinchDist0 > 0) {
                zoomTo(pinchScale0 * dist / pinchDist0, (a.x + b.x) / 2, (a.y + b.y) / 2);
            }
        } else if (panning) {
            panX = panStart.panX + (e.clientX - panStart.x);
            panY = panStart.panY + (e.clientY - panStart.y);
            applyTransform();
        }
    });

    const endPan = (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.delete(e.pointerId);
        if (pointers.size === 1) {
            // Остался один палец — продолжаем панорамирование от него
            const [p] = [...pointers.values()];
            panning = true;
            panStart = { x: p.x, y: p.y, panX, panY };
        } else if (pointers.size === 0) {
            panning = false;
        }
    };
    boardWrap.addEventListener('pointerup', endPan);
    boardWrap.addEventListener('pointercancel', endPan);

    // --- РЕНДЕРИНГ И ДВИЖЕНИЕ ---

    // Экранирование для подстановки в css url("...")
    const cssUrl = (src) => String(src).replace(/["\\]/g, '\\$&');

    // Фишка не должна уезжать за границы карты
    function clampToBoard(x, y, size = 60) {
        const maxX = Math.max(0, board.offsetWidth - size);
        const maxY = Math.max(0, board.offsetHeight - size);
        return { x: clamp(x, 0, maxX), y: clamp(y, 0, maxY) };
    }

    // После смены карты (другой размер) возвращаем уехавшие фишки внутрь
    function clampAllTokens() {
        let changed = false;
        Object.values(gameState.tokens).forEach(pos => {
            const p = clampToBoard(pos.x, pos.y);
            if (p.x !== pos.x || p.y !== pos.y) {
                pos.x = p.x;
                pos.y = p.y;
                changed = true;
            }
        });
        return changed;
    }

    function renderBoard() {
        const board = document.getElementById('board');
        // Кавычки обязательны: в обычных URL бывают скобки и пробелы, которые ломают css url(...)
        board.style.backgroundImage = gameState.bgImage ? `url("${cssUrl(gameState.bgImage)}")` : 'none';

        if (gameState.bgImage) {
            const img = new Image();
            img.src = gameState.bgImage;
            img.onload = () => {
                board.style.width = img.width + 'px';
                board.style.height = img.height + 'px';
                // Размер поля известен только сейчас — подтягиваем фишки внутрь новых границ
                if (isHost && clampAllTokens()) {
                    saveAndBroadcast();
                    renderBoard();
                }
            };
        } else {
            board.style.width = '';
            board.style.height = '';
        }

        board.innerHTML = '';

        Object.entries(gameState.tokens).forEach(([name, pos]) => {
            const token = document.createElement('div');
            token.className = 'token';

            if (pos.avatar) {
                token.style.backgroundImage = `url("${cssUrl(pos.avatar)}")`;
                token.innerText = '';
            } else {
                token.innerText = name.substring(0, 2).toUpperCase();
            }

            const label = document.createElement('div');
            label.className = 'token-label';
            label.innerText = name;
            token.appendChild(label);

            token.style.left = pos.x + 'px';
            token.style.top = pos.y + 'px';

            const canMove = isHost || name === myPlayerName;

            if (canMove) {
                makeDraggable(token, name);
            } else {
                token.classList.add('disabled');
            }

            board.appendChild(token);
        });
    }

    function makeDraggable(element, playerName) {
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        // Pointer Events объединяют мышь и тач — работают и на десктопе, и на мобильных
        element.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            initialLeft = element.offsetLeft;
            initialTop = element.offsetTop;
            element.style.cursor = 'grabbing';
            // Захватываем указатель, чтобы движение отслеживалось даже за пределами фишки
            element.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        element.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            // Экранное смещение делим на масштаб, чтобы фишка следовала за пальцем/курсором
            const dx = (e.clientX - startX) / boardScale;
            const dy = (e.clientY - startY) / boardScale;

            // Не даем вытащить фишку за пределы карты
            const { x: newX, y: newY } = clampToBoard(
                initialLeft + dx, initialTop + dy, element.offsetWidth
            );

            element.style.left = newX + 'px';
            element.style.top = newY + 'px';

            gameState.tokens[playerName].x = newX;
            gameState.tokens[playerName].y = newY;
        });

        const endDrag = (e) => {
            if (!isDragging) return;
            isDragging = false;
            element.style.cursor = 'grab';
            if (e && e.pointerId != null && element.hasPointerCapture(e.pointerId)) {
                element.releasePointerCapture(e.pointerId);
            }

            // Отправляем перемещение
            sendMove({
                name: playerName,
                x: gameState.tokens[playerName].x,
                y: gameState.tokens[playerName].y
            });

            if (isHost) {
                saveAndBroadcast();
            }
        };

        element.addEventListener('pointerup', endDrag);
        element.addEventListener('pointercancel', endDrag);
    }
</script>
</body>
</html>
